name: 📱 Compilar APK de Android (Buildozer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Caché de herramientas Android (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform/android-sdk
            .buildozer/android/platform/android-ndk*
          key: buildozer-android-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-

      - name: 📦 Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install "pip<25.0" setuptools wheel
          pip install "buildozer>=1.5.0" "cython<3.0" virtualenv

      - name: 🛠️ Preparar python-for-android con soporte de pip compatible
        run: |
          mkdir -p .buildozer/android/platform
          if [ ! -d ".buildozer/android/platform/python-for-android" ]; then
            git clone --depth 1 https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          fi
          # Evitar el bug de 'BuildDependencyInstallError' forzando pip < 25.0 en el entorno interno de p4a
          find .buildozer/android/platform/python-for-android/pythonforandroid/ -name "*.py" -exec sed -i 's/pip install -U pip/pip install -U "pip<25.0"/g' {} +
          find .buildozer/android/platform/python-for-android/pythonforandroid/ -name "*.py" -exec sed -i 's/pip install --upgrade pip/pip install --upgrade "pip<25.0"/g' {} +

      - name: 📱 Compilar APK con Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer -v android debug

      - name: 📤 Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: ConversorAudio-Android-APK
          path: bin/*.apk
          retention-days: 30
