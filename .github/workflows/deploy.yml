name: 🚀 Despliegue Automático a AWS (M4A to MP3)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de M4A to MP3 en AWS..."
            cd ${{ secrets.AWS_PROJECT_PATH }}

            # Configurar directorio seguro para Git
            sudo git config --global --add safe.directory ${{ secrets.AWS_PROJECT_PATH }}

            # 1. Descargar ultimos cambios
            git fetch origin main
            git reset --hard origin/main

            # 2. Reconstruir y reiniciar contenedor Docker
            if [ -f "docker-compose.yml" ]; then
              docker compose down || true
              docker compose up -d --build
            fi

            echo "✅ ¡Despliegue de M4A to MP3 completado exitosamente!"
