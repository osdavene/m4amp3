name: 🚀 Despliegue Automático a AWS (M4A to MP3)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Desplegar en Servidor AWS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Ejecutar Despliegue en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Iniciando despliegue de M4A to MP3 en CloudPanel..."
            sudo git config --global --add safe.directory /home/m4amp3/htdocs/m4amp3.duckdns.org

            sudo -u m4amp3 bash << 'EOF'
            set -e
            cd /home/m4amp3/htdocs/m4amp3.duckdns.org

            # 1. Descargar ultimos cambios
            git fetch origin main
            git reset --hard origin/main

            # 2. Actualizar dependencias de Python si cambiaron
            ./.venv/bin/pip install -r requirements.txt
            EOF

            # 3. Reiniciar el servicio en segundo plano
            sudo systemctl restart m4amp3.service

            echo "✅ ¡Despliegue de M4A to MP3 completado exitosamente con 0 downtime!"
